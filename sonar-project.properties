sonar.projectKey=FleetOpsProyect_grupo_02_asignaciones
sonar.organization=fleetopsproyect-1

# Indicar dónde está el código fuente y dónde están los tests
sonar.sources=src
sonar.tests=tests

# Ruta del reporte generado por pytest
sonar.python.coverage.reportPaths=coverage.xml

# Excluir de análisis general e inspección de cobertura (Alembic e __init__)
sonar.exclusions=alembic/**,**/__init__.py
sonar.coverage.exclusions=alembic/**