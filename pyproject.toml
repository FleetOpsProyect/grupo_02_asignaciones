[project]
name = "ms-asignaciones"
version = "0.1.0"
description = "Microservicio de Asignaciones - FleetOps (Grupo 02, Desarrollo de Software III)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-smorest>=0.47.0",
    "gunicorn>=26.2.0",
    "prometheus-flask-exporter>=0.23.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assignments"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "flask_smorest.*", "prometheus_flask_exporter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires Docker (Testcontainers)",
]

[tool.coverage.run]
relative_files = true
source = ["src"]
omit = [
    "src/assignments/*/__init__.py",
    "*/alembic/*",
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
